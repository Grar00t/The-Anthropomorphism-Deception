<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Anthropomorphism Deception — The Wrapper Ledger</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0a0a0c}iframe{display:block;width:100%;height:100%;border:0}.audio{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid #c9a253;background:rgba(10,10,12,.88);backdrop-filter:blur(12px);color:#e4c47d;font:11px monospace;letter-spacing:.12em}.audio button{border:1px solid #c9a253;background:none;color:#e4c47d;padding:6px 9px;cursor:pointer}.audio button:hover{background:#c9a253;color:#0a0a0c}</style>
</head>
<body>
<iframe src="./original-index.html" title="The Anthropomorphism Deception"></iframe>
<div class="audio"><span id="state">ELEVATOR FM</span><button id="play">PLAY</button><button id="mute">MUTE</button></div>
<audio id="music" src="https://github.com/Grar00t/The-Anthropomorphism-Deception/raw/refs/heads/main/elvator.mp3" preload="auto" autoplay loop playsinline></audio>
<script>
const m=document.getElementById('music'),p=document.getElementById('play'),u=document.getElementById('mute'),st=document.getElementById('state');
m.volume=.34;
const tryPlay=()=>m.play().catch(()=>{});
tryPlay();
['pointerdown','touchstart','keydown'].forEach(e=>addEventListener(e,tryPlay,{once:true,capture:true}));
p.onclick=()=>m.paused?tryPlay():m.pause();
u.onclick=()=>{m.muted=!m.muted;u.textContent=m.muted?'UNMUTE':'MUTE'};
m.onplay=()=>{p.textContent='PAUSE';st.textContent='ELEVATOR FM · PLAYING'};
m.onpause=()=>{p.textContent='PLAY';st.textContent='ELEVATOR FM · PAUSED'};
</script>
</body>
</html>
